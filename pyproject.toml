[project]
name = "explainable-ml-gui"
version = "0.1.0"
description = "可解释机器学习 GUI 程序：选模型 / 导入 Excel / 选优化方法 / 选输出图表 (NiceGUI)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # GUI
    "nicegui>=2.0.0",
    # 数据 / 数值
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "openpyxl>=3.1.5",
    "category-encoders>=2.7.0",
    "joblib>=1.3",
    # 绘图
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pygam>=0.9.1",
    # 模型
    "scikit-learn==1.5.1",
    "xgboost==2.0.0",
    "lightgbm>=4.6.0",
    "catboost==1.2.7",
    # 可解释性
    "shap==0.42.1",
    "pyale>=1.2.0",
    # 超参数优化
    "optuna>=4.4.0",
    "cmaes>=0.12.0",
    "mealpy>=3.0.1",
]

[tool.uv]
# 本项目为独立工程，不并入上级 workspace
package = false

[tool.uv.workspace]
members = []
