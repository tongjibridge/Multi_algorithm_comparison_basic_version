    <text x="62" y="158" font-size="60" font-weight="760" fill="#0B1B3D" letter-spacing="-1.6">ExplainableML</text>
    <text x="64" y="202" font-size="28" font-weight="650" fill="#234269">从 Excel 表格到可解释的回归证据</text>
    <text x="64" y="240" font-size="20" fill="#5B6F8D">多模型比较 · 无泄漏交叉验证 · SHAP / PDP / ALE · 期刊级出图</text>
    <g transform="translate(64 286)"><rect width="154" height="48" rx="12" fill="#FFFFFF" stroke="#D6E1EF"/><text x="18" y="20" font-size="14" font-weight="700" fill="#6A7D98" letter-spacing="1">CORE MODELS</text><text x="18" y="40" font-size="22" font-weight="760" fill="#0B1B3D">9 个</text></g>
