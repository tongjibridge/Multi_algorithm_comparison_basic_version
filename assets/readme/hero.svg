    <g transform="translate(400 286)"><rect width="154" height="48" rx="12" fill="#FFFFFF" stroke="#D6E1EF"/><text x="18" y="20" font-size="14" font-weight="700" fill="#6A7D98" letter-spacing="1">OUTPUT TYPES</text><text x="18" y="40" font-size="22" font-weight="760" fill="#0B1B3D">12 类</text></g>
