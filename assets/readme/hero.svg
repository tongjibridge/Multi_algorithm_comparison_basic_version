<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">ExplainableML — local explainable machine learning workbench</title>
  <desc id="desc">A research workbench that turns Excel data into multi-model regression comparisons and explainable evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFD"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient>
    <linearGradient id="plot" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#176CF4"/><stop offset="1" stop-color="#33B5A5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1B3D" flood-opacity=".09"/></filter>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
