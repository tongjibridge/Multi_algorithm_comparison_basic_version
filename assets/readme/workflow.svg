<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ExplainableML five-stage workflow</title><desc id="desc">Import Excel, define columns, compare models, optimize with cross-validation, and export explainable evidence.</desc>
  <defs><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif}</style></defs>
  <rect width="1200" height="320" rx="24" fill="#F8FAFD"/><path d="M144 150H1056" stroke="#C8D6E6" stroke-width="3"/><path d="M1042 139L1057 150L1042 161" fill="none" stroke="#C8D6E6" stroke-width="3"/>
  <g class="sans">
    <g transform="translate(56 66)"><rect width="184" height="168" rx="18" fill="#FFFFFF" stroke="#D7E2EF"/><circle cx="32" cy="32" r="17" fill="#176CF4"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF">1</text><text x="24" y="84" font-size="24" font-weight="750" fill="#0B1B3D">导入 Excel</text><text x="24" y="116" font-size="18" fill="#60748F">上传或本地路径</text><text x="24" y="144" font-size="18" fill="#60748F">预览原始表格</text></g>
    <g transform="translate(282 66)"><rect width="184" height="168" rx="18" fill="#FFFFFF" stroke="#D7E2EF"/><circle cx="32" cy="32" r="17" fill="#176CF4"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF">2</text><text x="24" y="84" font-size="24" font-weight="750" fill="#0B1B3D">定义列角色</text><text x="24" y="116" font-size="18" fill="#60748F">目标 / 特征 / 分类</text><text x="24" y="144" font-size="18" fill="#60748F">标准化策略</text></g>
    <g transform="translate(508 66)"><rect width="184" height="168" rx="18" fill="#0B1B3D"/><circle cx="32" cy="32" r="17" fill="#33B5A5"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF">3</text><text x="24" y="84" font-size="24" font-weight="750" fill="#FFFFFF">比较模型</text><text x="24" y="116" font-size="18" fill="#B7C9DF">9 个核心回归器</text><text x="24" y="144" font-size="18" fill="#B7C9DF">搜索空间可编辑</text></g>
    <g transform="translate(734 66)"><rect width="184" height="168" rx="18" fill="#FFFFFF" stroke="#D7E2EF"/><circle cx="32" cy="32" r="17" fill="#C15060"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF">4</text><text x="24" y="84" font-size="24" font-weight="750" fill="#0B1B3D">交叉验证</text><text x="24" y="116" font-size="18" fill="#60748F">Optuna / mealpy</text><text x="24" y="144" font-size="18" fill="#60748F">预处理无泄漏</text></g>
    <g transform="translate(960 66)"><rect width="184" height="168" rx="18" fill="#FFFFFF" stroke="#D7E2EF"/><circle cx="32" cy="32" r="17" fill="#33B5A5"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF">5</text><text x="24" y="84" font-size="24" font-weight="750" fill="#0B1B3D">输出证据</text><text x="24" y="116" font-size="18" fill="#60748F">指标 + 解释图</text><text x="24" y="144" font-size="18" fill="#60748F">PNG / SVG / PDF</text></g>
  </g>
</svg>
